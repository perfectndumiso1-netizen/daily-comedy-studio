name: Generate comedy video

on:
  workflow_dispatch:
    inputs:
      category:
        description: Comedy category (or leave random)
        required: true
        type: choice
        default: random
        options:
          - random
          - absurd-situations
          - everyday-life
          - family-life
          - funny-animals
          - relationships
          - relatable-life
          - unexpected
          - work-life

permissions:
  contents: read

jobs:
  generate:
    name: Render one original vertical comedy
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install rendering dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Restore recent-concept history
        uses: actions/cache/restore@v4
        with:
          path: output/history.json
          key: comedy-history-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            comedy-history-${{ github.ref_name }}-

      - name: Run automated tests
        run: python -m unittest discover -s tests -v

      - name: Generate and validate MP4
        run: >-
          python -m comedy_studio
          --category "${{ inputs.category }}"
          --output output/comedy.mp4
          --report output/scenario.txt
          --history output/history.json

      - name: Save recent-concept history
        if: success()
        uses: actions/cache/save@v4
        with:
          path: output/history.json
          key: comedy-history-${{ github.ref_name }}-${{ github.run_id }}

      - name: Upload video and scenario as downloadable artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: daily-comedy-${{ github.run_number }}
          path: |
            output/comedy.mp4
            output/scenario.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Write run summary
        if: always()
        run: |
          {
            echo '## Daily Comedy Studio'
            if [ -s output/scenario.txt ]; then
              echo 'Generation succeeded. Download the MP4 and scenario.txt from the artifact above.'
              echo
              echo '```text'
              cat output/scenario.txt
              echo '```'
            else
              echo 'Generation did not finish. Review the failed step logs; no video artifact is available.'
              echo 'Check dependency installation, FFmpeg encoding output, and the test results.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
